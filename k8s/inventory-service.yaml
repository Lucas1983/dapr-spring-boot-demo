apiVersion: v1
kind: Service
metadata:
  name: inventory-service
spec:
  selector:
    app: inventory-service
  ports:
    - name: app-port
      port: 8081
      targetPort: 8081
      protocol: TCP
      nodePort: 30081
    - name: debug-port
      port: 5081
      targetPort: 5081
      protocol: TCP
      nodePort: 30581
  type: NodePort