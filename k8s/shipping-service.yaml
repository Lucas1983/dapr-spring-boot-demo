apiVersion: v1
kind: Service
metadata:
  name: shipping-service
spec:
  selector:
    app: shipping-service
  ports:
    - name: app-port
      port: 8083
      targetPort: 8083
      protocol: TCP
      nodePort: 30083
    - name: debug-port
      port: 5083
      targetPort: 5083
      protocol: TCP
      nodePort: 30583
  type: NodePort