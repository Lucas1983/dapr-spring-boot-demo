version: "3.9"

services:
  common-base:
    build:
      context: .
      dockerfile: Dockerfile
    image: common-base:latest
    volumes:
      - gradle-cache:/home/gradle/.gradle
    command: ["true"]

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    image: inventory-service:latest
    volumes:
      - gradle-cache:/home/gradle/.gradle
    ports:
      - "8081:8081"
    environment:
      - JAVA_OPTS=
    restart: unless-stopped
    depends_on:
      common-base:
        condition: service_completed_successfully

  shipping-service:
    build:
      context: .
      dockerfile: shipping-service/Dockerfile
    image: shipping-service:latest
    volumes:
      - gradle-cache:/home/gradle/.gradle
    ports:
      - "8083:8083"
    environment:
      - JAVA_OPTS=
    restart: unless-stopped
    depends_on:
      common-base:
        condition: service_completed_successfully

  customer-service:
    build:
      context: .
      dockerfile: customer-service/Dockerfile
    image: customer-service:latest
    volumes:
      - gradle-cache:/home/gradle/.gradle
    ports:
      - "8084:8084"
    environment:
      - JAVA_OPTS=
    restart: unless-stopped
    depends_on:
      common-base:
        condition: service_completed_successfully

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    image: order-service:latest
    volumes:
      - gradle-cache:/home/gradle/.gradle
    ports:
      - "8082:8082"
    environment:
      - JAVA_OPTS=
    restart: unless-stopped
    depends_on:
      common-base:
        condition: service_completed_successfully

volumes:
    gradle-cache:

networks:
  default:
    name: dapr-spring-boot-demo